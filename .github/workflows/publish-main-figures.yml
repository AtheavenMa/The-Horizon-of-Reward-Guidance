name: Publish Main Figures

on:
  push:
    paths:
      - plotting/render_main_figures.py
      - .github/workflows/publish-main-figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install numpy matplotlib
      - name: Render high-resolution figures
        run: python plotting/render_main_figures.py
      - name: Verify files and vector editability
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          for n in range(2, 7):
              for ext in ("png", "svg", "pdf"):
                  p = Path(f"assets/figures/fig{n}.{ext}")
                  assert p.is_file() and p.stat().st_size > 1000, p
              png = Path(f"assets/figures/fig{n}.png").read_bytes()
              assert png[:8] == b"\x89PNG\r\n\x1a\n"
              width, height = struct.unpack(">II", png[16:24])
              assert width > 1500 and height > 700
              svg = Path(f"assets/figures/fig{n}.svg").read_text(encoding="utf-8")
              assert "<svg" in svg and "<text" in svg
              print(f"Figure {n} verified, PNG {width}×{height}")
          PY
      - name: Commit rendered figures to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figures/fig2.png assets/figures/fig2.svg assets/figures/fig2.pdf \
                  assets/figures/fig3.png assets/figures/fig3.svg assets/figures/fig3.pdf \
                  assets/figures/fig4.png assets/figures/fig4.svg assets/figures/fig4.pdf \
                  assets/figures/fig5.png assets/figures/fig5.svg assets/figures/fig5.pdf \
                  assets/figures/fig6.png assets/figures/fig6.svg assets/figures/fig6.pdf
          if git diff --cached --quiet; then
            echo "Figures already up to date"
          else
            git commit -m "assets: publish Figures 2-6 in SVG PNG and PDF"
            git push origin HEAD:main
          fi
